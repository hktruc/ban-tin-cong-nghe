<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Dự báo tại thời điểm nào?</title><desc id="desc">Dữ liệu đến muộn phải nằm ngoài đầu vào. Đồ họa khái niệm nguyên bản, chưa phải kết quả thực nghiệm.</desc><rect width="960" height="540" fill="#eef3ef"/><path d="M0 170L960 20V0H0Z" fill="#dfe9e3"/><g font-family="Arial, sans-serif"><text x="55" y="57" font-size="17" fill="#355e91" font-weight="600" text-anchor="start">BẢN TIN CÔNG NGHỆ • 09.11.2026</text><text x="55" y="122" font-size="38" fill="#18322d" font-weight="700" text-anchor="start">Dự báo tại thời điểm nào?</text><text x="55" y="166" font-size="21" fill="#50635d" font-weight="400" text-anchor="start">Dữ liệu đến muộn phải nằm ngoài đầu vào</text><path d="M90 305 L870 305" stroke="#355e91" stroke-width="4" fill="none" /><rect x="75" y="215" width="260" height="65" rx="15" fill="white" stroke="#355e91" stroke-width="2"/><text x="205.0" y="255.5" font-size="23" fill="#355e91" font-weight="600" text-anchor="middle">Dữ liệu đã có</text><rect x="605" y="330" width="280" height="65" rx="15" fill="white" stroke="#a34b1b" stroke-width="2"/><text x="745.0" y="370.5" font-size="23" fill="#a34b1b" font-weight="600" text-anchor="middle">Bản ghi đến muộn</text><circle cx="475" cy="305" r="13" fill="#355e91"/><path d="M475 275 L475 393" stroke="#355e91" stroke-width="4" fill="none" stroke-dasharray="8 8"/><text x="475" y="250" font-size="22" fill="#355e91" font-weight="700" text-anchor="middle">MỐC DỰ BÁO</text><text x="165" y="355" font-size="19" fill="#355e91" font-weight="700" text-anchor="start">ĐƯỢC DÙNG</text><text x="745" y="290" font-size="19" fill="#a34b1b" font-weight="700" text-anchor="middle">CHƯA ĐƯỢC DÙNG</text><text x="55" y="492" font-size="17" fill="#50635d" font-weight="500" text-anchor="start">MINH HỌA PHƯƠNG PHÁP • CHƯA THỰC NGHIỆM</text></g></svg>