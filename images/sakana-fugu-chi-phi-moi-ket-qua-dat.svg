<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Tính giá một kết quả đạt</title><desc id="desc">Tính cả lần thử không đạt và công kiểm lại. Đồ họa khái niệm nguyên bản, chưa phải kết quả thực nghiệm.</desc><rect width="960" height="540" fill="#eef3ef"/><path d="M0 170L960 20V0H0Z" fill="#dfe9e3"/><g font-family="Arial, sans-serif"><text x="55" y="57" font-size="17" fill="#355e91" font-weight="600" text-anchor="start">BẢN TIN CÔNG NGHỆ • 09.11.2026</text><text x="55" y="122" font-size="38" fill="#18322d" font-weight="700" text-anchor="start">Tính giá một kết quả đạt</text><text x="55" y="166" font-size="21" fill="#50635d" font-weight="400" text-anchor="start">Tính cả lần thử không đạt và công kiểm lại</text><text x="480" y="245" font-size="29" fill="#355e91" font-weight="600" text-anchor="middle">Tổng phí thử + chi phí kiểm lại</text><path d="M160 275 L800 275" stroke="#355e91" stroke-width="4" fill="none" /><text x="480" y="320" font-size="29" fill="#355e91" font-weight="600" text-anchor="middle">Số kết quả đạt đủ tiêu chí</text><text x="480" y="392" font-size="23" fill="#a34b1b" font-weight="600" text-anchor="middle">Không có kết quả đạt: báo rõ, không ghi chi phí = 0</text><text x="55" y="492" font-size="17" fill="#50635d" font-weight="500" text-anchor="start">MINH HỌA PHƯƠNG PHÁP • CHƯA THỰC NGHIỆM</text></g></svg>