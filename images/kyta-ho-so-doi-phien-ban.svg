<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Hồ sơ đổi, duyệt bản nào?</title><desc id="desc">Bản A đã duyệt không tự động cấp sự chấp thuận cho bản B. Sơ đồ phương pháp nguyên bản, chưa thực nghiệm Kyta.</desc><rect width="960" height="540" fill="#f6efe6"/><path d="M0 175L960 20V0H0Z" fill="#ede3d7"/><g font-family="Arial, sans-serif"><text x="55" y="57" font-size="17" font-weight="500" fill="#7b452e" text-anchor="start">BẢN TIN CÔNG NGHỆ • 10.11.2026</text><text x="55" y="122" font-size="38" font-weight="700" fill="#292f29" text-anchor="start">Hồ sơ đổi, duyệt bản nào?</text><text x="55" y="165" font-size="22" font-weight="500" fill="#635d53" text-anchor="start">Truy từ quyết định về đúng phiên bản tài liệu</text><rect x="70" y="225" width="270" height="165" rx="18" fill="#fffdf9" stroke="#2d6d5e" stroke-width="2"/><text x="100" y="267" font-size="24" font-weight="700" fill="#2d6d5e" text-anchor="start">BẢN A</text><text x="100" y="310" font-size="22" font-weight="500" fill="#343e36" text-anchor="start">12 người • đã duyệt</text><text x="100" y="351" font-size="20" font-weight="500" fill="#635d53" text-anchor="start">Giữ bằng chứng cũ</text><rect x="620" y="225" width="270" height="165" rx="18" fill="#fffdf9" stroke="#ab5634" stroke-width="2"/><text x="650" y="267" font-size="24" font-weight="700" fill="#7b452e" text-anchor="start">BẢN B</text><text x="650" y="310" font-size="22" font-weight="500" fill="#343e36" text-anchor="start">40 người • đổi hồ sơ</text><text x="650" y="351" font-size="20" font-weight="500" fill="#635d53" text-anchor="start">Kiểm quy tắc duyệt lại</text><path d="M355 305H600" stroke="#ab5634" stroke-width="3"/><path d="M588 294L600 305L588 316" fill="none" stroke="#ab5634" stroke-width="3"/><rect x="385" y="266" width="185" height="78" rx="18" fill="#fffdf9" stroke="#ab5634" stroke-width="2"/><text x="477" y="314" font-size="23" font-weight="700" fill="#7b452e" text-anchor="middle">KIỂM LẠI</text><text x="480" y="430" font-size="23" font-weight="600" fill="#292f29" text-anchor="middle">AI đọc xong ≠ người có thẩm quyền đã duyệt</text><text x="55" y="492" font-size="17" font-weight="500" fill="#635d53" text-anchor="start">MINH HỌA PHƯƠNG PHÁP • CHƯA THỰC NGHIỆM</text></g></svg>