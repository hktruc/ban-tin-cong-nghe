<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Dự báo bằng dữ liệu đã biết</title><desc id="desc">Không thay dự báo thời tiết bằng số đo tương lai. Đồ họa khái niệm nguyên bản, chưa phải kết quả thực nghiệm.</desc><rect width="960" height="540" fill="#eef3ef"/><path d="M0 170L960 20V0H0Z" fill="#dfe9e3"/><g font-family="Arial, sans-serif"><text x="55" y="57" font-size="17" fill="#a34b1b" font-weight="600" text-anchor="start">BẢN TIN CÔNG NGHỆ • 09.11.2026</text><text x="55" y="122" font-size="38" fill="#18322d" font-weight="700" text-anchor="start">Dự báo bằng dữ liệu đã biết</text><text x="55" y="166" font-size="21" fill="#50635d" font-weight="400" text-anchor="start">Không thay dự báo thời tiết bằng số đo tương lai</text><rect x="65" y="220" width="320" height="75" rx="15" fill="white" stroke="#a34b1b" stroke-width="2"/><text x="225.0" y="265.5" font-size="23" fill="#a34b1b" font-weight="600" text-anchor="middle">Dự báo thời tiết</text><rect x="65" y="330" width="320" height="75" rx="15" fill="white" stroke="#a34b1b" stroke-width="2"/><text x="225.0" y="375.5" font-size="23" fill="#a34b1b" font-weight="600" text-anchor="middle">Phụ tải quá khứ</text><rect x="560" y="260" width="330" height="100" rx="15" fill="white" stroke="#a34b1b" stroke-width="2"/><text x="725.0" y="318.0" font-size="23" fill="#a34b1b" font-weight="600" text-anchor="middle">Phụ tải ngày mai</text><path d="M400 257 L540 298" stroke="#a34b1b" stroke-width="4" fill="none" /><path d="M400 367 L540 325" stroke="#a34b1b" stroke-width="4" fill="none" /><text x="55" y="492" font-size="17" fill="#50635d" font-weight="500" text-anchor="start">MINH HỌA PHƯƠNG PHÁP • CHƯA THỰC NGHIỆM</text></g></svg>