<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">NEXUS: hai phía, một phép thử</title><desc id="desc">Chuẩn bị năng lực bổ sung nhau trước khi viết hồ sơ. Minh họa phương pháp nguyên bản, chưa thực nghiệm.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#006c58"/></marker></defs><rect width="960" height="540" fill="#eef3ef"/><path d="M0 170L960 20V0H0Z" fill="#dfe9e3"/><g font-family="Arial, sans-serif"><text x="55" y="57" font-size="17" fill="#006c58" font-weight="600" text-anchor="start">BẢN TIN CÔNG NGHỆ • 10.11.2026</text><text x="55" y="121" font-size="36" fill="#18322d" font-weight="700" text-anchor="start">NEXUS: hai phía, một phép thử</text><text x="55" y="164" font-size="21" fill="#50635d" font-weight="500" text-anchor="start">Chuẩn bị năng lực bổ sung nhau trước khi viết hồ sơ</text><rect x="55" y="219" width="250" height="89" rx="16" fill="#fff" stroke="#006c58" stroke-width="2"/><text x="80" y="252" font-size="16" fill="#006c58" font-weight="700" text-anchor="start">ĐỐI TÁC VIỆT NAM</text><text x="80" y="283" font-size="23" fill="#18322d" font-weight="500" text-anchor="start">Dữ liệu • bài toán</text><rect x="55" y="329" width="250" height="89" rx="16" fill="#fff" stroke="#006c58" stroke-width="2"/><text x="80" y="362" font-size="16" fill="#006c58" font-weight="700" text-anchor="start">ĐỐI TÁC NHẬT BẢN</text><text x="80" y="393" font-size="20" fill="#18322d" font-weight="500" text-anchor="start">Phương pháp • thiết bị</text><path d="M315 264H345V317H390" fill="none" stroke="#006c58" stroke-width="3" marker-end="url(#arrow)"/><path d="M315 374H345V317" fill="none" stroke="#006c58" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="265" width="210" height="104" rx="16" fill="#fff" stroke="#006c58" stroke-width="2"/><text x="510" y="304" font-size="22" fill="#18322d" font-weight="700" text-anchor="middle">Đề cương chung</text><text x="510" y="337" font-size="20" fill="#50635d" font-weight="500" text-anchor="middle">Phân công rõ</text><path d="M627 317H683" fill="none" stroke="#006c58" stroke-width="3" marker-end="url(#arrow)"/><rect x="695" y="265" width="210" height="104" rx="16" fill="#fff" stroke="#006c58" stroke-width="2"/><text x="800" y="304" font-size="24" fill="#18322d" font-weight="700" text-anchor="middle">Phép thử</text><text x="800" y="337" font-size="19" fill="#50635d" font-weight="500" text-anchor="middle">Tiêu chí biết trước</text><text x="405" y="421" font-size="17" fill="#50635d" font-weight="500" text-anchor="start">Ví dụ phân công • chưa phải yêu cầu của đợt gọi</text><text x="55" y="492" font-size="17" fill="#50635d" font-weight="500" text-anchor="start">MINH HỌA PHƯƠNG PHÁP • CHƯA THỰC NGHIỆM</text></g></svg>