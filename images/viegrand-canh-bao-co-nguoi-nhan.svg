<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Cảnh báo cần người phản hồi</title><desc id="desc">Ba trạng thái: sự kiện giả, đã gửi và đã xác nhận. Nhánh nét đứt chỉ việc cần hiển thị khi chưa có phản hồi. Không minh họa hiệu quả lâm sàng hoặc tính năng đã kiểm chứng.</desc><rect width="960" height="540" fill="#eef3ef"/><path d="M0 170L960 20V0H0Z" fill="#dfe9e3"/><g font-family="Arial, sans-serif"><text x="55" y="57" font-size="17" fill="#a34b1b" font-weight="600" text-anchor="start">BẢN TIN CÔNG NGHỆ • 10.11.2026</text><text x="55" y="120" font-size="37" fill="#18322d" font-weight="700" text-anchor="start">Cảnh báo cần người phản hồi</text><text x="55" y="163" font-size="21" fill="#50635d" font-weight="400" text-anchor="start">Diễn tập đường nhận tin, không thử biến cố sức khỏe</text><rect x="60" y="230" width="240" height="125" rx="16" fill="white" stroke="#a34b1b" stroke-width="2"/><text x="180" y="280" font-size="24" fill="#a34b1b" font-weight="700" text-anchor="middle">Sự kiện giả</text><text x="180" y="320" font-size="17" fill="#50635d" font-weight="400" text-anchor="middle">Không tạo nguy hiểm</text><rect x="360" y="230" width="240" height="125" rx="16" fill="white" stroke="#a34b1b" stroke-width="2"/><text x="480" y="280" font-size="24" fill="#a34b1b" font-weight="700" text-anchor="middle">Đã gửi</text><text x="480" y="320" font-size="17" fill="#50635d" font-weight="400" text-anchor="middle">Chưa chắc đã nhận</text><rect x="660" y="230" width="240" height="125" rx="16" fill="white" stroke="#a34b1b" stroke-width="2"/><text x="780" y="280" font-size="24" fill="#a34b1b" font-weight="700" text-anchor="middle">Đã xác nhận</text><text x="780" y="320" font-size="17" fill="#50635d" font-weight="400" text-anchor="middle">Có người phản hồi</text><path d="M300 293H350 M340 286L350 293L340 300" fill="none" stroke="#a34b1b" stroke-width="3"/><path d="M600 293H650 M640 286L650 293L640 300" fill="none" stroke="#a34b1b" stroke-width="3"/><path d="M480 355V405H780V355" fill="none" stroke="#a34b1b" stroke-width="3" stroke-dasharray="7 6"/><text x="630" y="437" font-size="20" fill="#a34b1b" font-weight="600" text-anchor="middle">Chưa có phản hồi → báo rõ trạng thái</text><text x="55" y="492" font-size="17" fill="#50635d" font-weight="500" text-anchor="start">MINH HỌA PHƯƠNG PHÁP • CHƯA THỰC NGHIỆM</text></g></svg>