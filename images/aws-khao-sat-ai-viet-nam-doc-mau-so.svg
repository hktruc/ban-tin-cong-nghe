<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Tỷ lệ nào, mẫu số nào?</title><desc id="desc">Tách toàn mẫu khỏi nhóm đã sử dụng AI. Đồ họa khái niệm nguyên bản, chưa phải kết quả thực nghiệm.</desc><rect width="960" height="540" fill="#eef3ef"/><path d="M0 170L960 20V0H0Z" fill="#dfe9e3"/><g font-family="Arial, sans-serif"><text x="55" y="57" font-size="17" fill="#355e91" font-weight="600" text-anchor="start">BẢN TIN CÔNG NGHỆ • 09.11.2026</text><text x="55" y="122" font-size="38" fill="#18322d" font-weight="700" text-anchor="start">Tỷ lệ nào, mẫu số nào?</text><text x="55" y="166" font-size="21" fill="#50635d" font-weight="400" text-anchor="start">Tách toàn mẫu khỏi nhóm đã sử dụng AI</text><rect x="70" y="220" width="820" height="185" rx="20" fill="white" stroke="#355e91" stroke-width="2"/><text x="100" y="260" font-size="21" fill="#355e91" font-weight="700" text-anchor="start">TOÀN BỘ DOANH NGHIỆP TRONG KHẢO SÁT</text><rect x="320" y="285" width="530" height="90" rx="15" fill="#d7e9df"/><text x="585" y="323" font-size="24" fill="#355e91" font-weight="600" text-anchor="middle">Nhóm đã dùng AI</text><text x="585" y="355" font-size="20" fill="#355e91" font-weight="500" text-anchor="middle">Tự báo lợi ích ≠ mức tăng năng suất</text><text x="55" y="492" font-size="17" fill="#50635d" font-weight="500" text-anchor="start">MINH HỌA PHƯƠNG PHÁP • CHƯA THỰC NGHIỆM</text></g></svg>