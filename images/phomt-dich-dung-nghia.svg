<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">DỊCH TRÔI CHẢY ≠ DỊCH ĐÚNG</title><desc id="desc">Giữ nguyên ý trước khi làm câu văn đẹp hơn. Sơ đồ biên tập nguyên bản, không phải ảnh sản phẩm hay kết quả thực nghiệm.</desc><rect width="960" height="540" fill="#f4f3eb"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="52" y="56" font-size="16" letter-spacing="2" fill="#b16d34">AI VIỆT NAM · 07.11.2026</text><text x="52" y="111" font-size="29" font-weight="700" fill="#172f35">DỊCH TRÔI CHẢY ≠ DỊCH ĐÚNG</text><text x="52" y="151" font-size="20" fill="#50656b">Giữ nguyên ý trước khi làm câu văn đẹp hơn.</text><rect x="52" y="205" width="250" height="208" rx="16" fill="#fff" stroke="#b16d34" stroke-width="2"/><circle cx="177" cy="279" r="38" fill="#b16d34"/><text x="177" y="291" font-size="31" font-weight="700" text-anchor="middle" fill="white">01</text><text x="177" y="364" text-anchor="middle" font-size="18" font-weight="700" fill="#172f35">Câu gốc</text><path d="M314 309h28m-9-9 9 9-9 9" stroke="#b16d34" stroke-width="3" fill="none"/><rect x="354" y="205" width="250" height="208" rx="16" fill="#fff" stroke="#b16d34" stroke-width="2"/><circle cx="479" cy="279" r="38" fill="#b16d34"/><text x="479" y="291" font-size="31" font-weight="700" text-anchor="middle" fill="white">02</text><text x="479" y="364" text-anchor="middle" font-size="18" font-weight="700" fill="#172f35">Kiểm ý nghĩa</text><path d="M616 309h28m-9-9 9 9-9 9" stroke="#b16d34" stroke-width="3" fill="none"/><rect x="656" y="205" width="250" height="208" rx="16" fill="#fff" stroke="#b16d34" stroke-width="2"/><circle cx="781" cy="279" r="38" fill="#b16d34"/><text x="781" y="291" font-size="31" font-weight="700" text-anchor="middle" fill="white">03</text><text x="781" y="364" text-anchor="middle" font-size="18" font-weight="700" fill="#172f35">Duyệt bản dịch</text><text x="52" y="477" font-size="17" fill="#50656b">Sơ đồ nguyên bản · Phương pháp đề xuất, chưa thực nghiệm</text></g></svg>