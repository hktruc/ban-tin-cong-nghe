<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Sửa đúng, không sửa thừa</title><desc id="desc">Sơ đồ hai nhánh: câu đúng được giữ nguyên, câu có lỗi rõ được sửa tối thiểu rồi tác giả duyệt. Không thể hiện kết quả đo.</desc><rect width="960" height="540" fill="#eef3ef"/><path d="M0 170L960 20V0H0Z" fill="#dfe9e3"/><g font-family="Arial, sans-serif"><text x="55" y="57" font-size="17" fill="#267968" font-weight="600" text-anchor="start">BẢN TIN CÔNG NGHỆ • 10.11.2026</text><text x="55" y="120" font-size="37" fill="#18322d" font-weight="700" text-anchor="start">Sửa đúng, không sửa thừa</text><text x="55" y="163" font-size="21" fill="#50635d" font-weight="400" text-anchor="start">Tách câu cần sửa khỏi câu nên được giữ nguyên</text><rect x="60" y="257" width="210" height="100" rx="16" fill="white" stroke="#267968" stroke-width="2"/><text x="165" y="297" font-size="25" fill="#18322d" font-weight="700" text-anchor="middle">Câu gốc</text><text x="165" y="329" font-size="17" fill="#50635d" font-weight="400" text-anchor="middle">Giữ ý và giọng viết</text><path d="M270 307H330 M330 238V378 M330 238H395 M330 378H395" fill="none" stroke="#267968" stroke-width="3"/><rect x="395" y="205" width="220" height="68" rx="16" fill="#d7e9df" stroke="#267968" stroke-width="2"/><text x="505" y="248" font-size="24" fill="#267968" font-weight="700" text-anchor="middle">Đã đúng</text><rect x="395" y="345" width="220" height="68" rx="16" fill="#fff0dd" stroke="#a34b1b" stroke-width="2"/><text x="505" y="388" font-size="24" fill="#a34b1b" font-weight="700" text-anchor="middle">Có lỗi rõ</text><path d="M615 239H670 M660 232L670 239L660 246" fill="none" stroke="#267968" stroke-width="3"/><path d="M615 379H670 M660 372L670 379L660 386" fill="none" stroke="#a34b1b" stroke-width="3"/><text x="695" y="235" font-size="24" fill="#267968" font-weight="700" text-anchor="start">Giữ nguyên</text><text x="695" y="264" font-size="18" fill="#50635d" font-weight="400" text-anchor="start">Không sửa thừa</text><text x="695" y="374" font-size="24" fill="#a34b1b" font-weight="700" text-anchor="start">Sửa tối thiểu</text><text x="695" y="403" font-size="18" fill="#50635d" font-weight="400" text-anchor="start">Tác giả duyệt lại</text><text x="55" y="492" font-size="17" fill="#50635d" font-weight="500" text-anchor="start">MINH HỌA PHƯƠNG PHÁP • CHƯA THỰC NGHIỆM</text></g></svg>